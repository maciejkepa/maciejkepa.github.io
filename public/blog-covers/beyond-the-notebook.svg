<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Beyond the Notebook cover</title>
  <desc id="desc">A notebook evolving into a repeatable machine learning production system</desc>
  <rect width="1200" height="720" fill="#081017" />
  <rect x="40" y="40" width="1120" height="640" rx="30" fill="#0d151c" stroke="#233645" />

  <text x="94" y="132" fill="#77e3ff" font-family="IBM Plex Mono, monospace" font-size="28" letter-spacing="6">BEYOND THE NOTEBOOK</text>
  <text x="94" y="248" fill="#edf3f7" font-family="Georgia, serif" font-size="84">When the model works,</text>
  <text x="94" y="328" fill="#edf3f7" font-family="Georgia, serif" font-size="84">the engineering starts</text>
  <text x="96" y="392" fill="#98a7b5" font-family="IBM Plex Sans, sans-serif" font-size="28">From experimentation to a system that can be versioned, deployed and operated</text>

  <g transform="translate(88 492)">
    <rect x="0" y="0" width="250" height="138" rx="22" fill="#0a1117" stroke="#28404f" />
    <text x="24" y="38" fill="#9af4c9" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="3">NOTEBOOK</text>
    <rect x="24" y="56" width="88" height="14" rx="7" fill="#77e3ff" fill-opacity=".18" />
    <rect x="24" y="84" width="184" height="12" rx="6" fill="#243645" />
    <rect x="24" y="106" width="140" height="12" rx="6" fill="#243645" />
  </g>

  <g stroke="#5d7388" stroke-width="6" stroke-linecap="round" opacity=".8">
    <path d="M360 562h96" />
    <path d="M748 562h96" />
  </g>

  <g transform="translate(470 460)">
    <rect x="0" y="0" width="260" height="204" rx="24" fill="#0a1117" stroke="#28404f" />
    <text x="26" y="38" fill="#ffd38d" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="3">PIPELINE</text>
    <rect x="26" y="58" width="208" height="36" rx="12" fill="#121c24" stroke="#33495a" />
    <rect x="26" y="108" width="208" height="36" rx="12" fill="#121c24" stroke="#33495a" />
    <rect x="26" y="158" width="208" height="20" rx="10" fill="#77e3ff" fill-opacity=".14" />
    <text x="42" y="82" fill="#dbe6ed" font-family="IBM Plex Sans, sans-serif" font-size="18">data + features</text>
    <text x="42" y="132" fill="#dbe6ed" font-family="IBM Plex Sans, sans-serif" font-size="18">training + packaging</text>
  </g>

  <g transform="translate(846 480)">
    <rect x="0" y="0" width="260" height="164" rx="24" fill="#0a1117" stroke="#28404f" />
    <text x="24" y="38" fill="#77e3ff" font-family="IBM Plex Mono, monospace" font-size="20" letter-spacing="3">PRODUCTION</text>
    <circle cx="42" cy="82" r="9" fill="#9af4c9" />
    <text x="62" y="88" fill="#dbe6ed" font-family="IBM Plex Sans, sans-serif" font-size="18">versioned interface</text>
    <circle cx="42" cy="116" r="9" fill="#9af4c9" />
    <text x="62" y="122" fill="#dbe6ed" font-family="IBM Plex Sans, sans-serif" font-size="18">monitoring and rollback</text>
  </g>
</svg>
